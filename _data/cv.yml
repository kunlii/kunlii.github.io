    Projects:
      - name: 面向数据资产的可信流通技术研究（主持，项目负责人）
        summary: 针对这些挑战，本课题围绕“可信远程评估”、“真实高效定价”和“稳定费率机制”这三个核心问题展开研究，引入隐私计算技术、博弈论等方法，以期设计高效可信的数据资产评估与交易机制，促进数据开放共享和可信流通，支持数字经济发展。
        highlights:
          - 国家自然科学基金项目
          - 数据要素
        start_date: 2025-01-01
        end_date: 2027-12-31
      
      - name: 面向QID的可信数据空间技术研究及应用（参与，课题负责人）
        summary: 研究可信工业数据空间下的数据评估与交易技术、工可信工业数据空间下的数据可信计算与流通技术。
        highlights:
          - 横向
          - 数据要素
        start_date: 2024-01-01
        end_date: 2026-12-31

      - name: 面向工业互联网的可信数据空间技术与应用（参与，课题负责人）
        summary: 本项目将构建覆盖数据全生命周期的“可信数据空间技术体系”，通过三大关键技术方向实现突破:一是基于动态规则库与Shapley值优化算法的数据质量评估体系，实现数据治理从人工经验向自动化、标准化转变;二是集成可信执行环境、安全多方计算等技术，设计跨域隐私计算框架，平衡数据流通的安全性与实时性;三是基于安全多方计算、同态加密、可信执行环境等技术，研制面向工业互联网数据的人工智能模型隐私推断技术。
        highlights:
          - 山东省重点研发计划（竞争性创新平台）
          - 数据要素
        start_date: 2026-07-01
        end_date: 2028-12-31


